name: CI Pipeline

on: [push]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train Model
        run: python train.py

      - name: Build Docker Image
        run: docker build -t mlops-assignment3 .

      - name: Run Container
        run: docker run mlops-assignment3

      - name: Push to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag mlops-assignment3 ${{ secrets.DOCKER_USERNAME }}/mlops-assignment3:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-assignment3:latest
